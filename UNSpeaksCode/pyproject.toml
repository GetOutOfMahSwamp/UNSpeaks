[project]
name = "unspeaks"
version = "0.1.0"
description = "MCP server that lets AI assistants answer questions about the United Nations using official UN data"
readme = "README.md"
authors = [
    { name = "GetOutOfMahSwamp", email = "robin.github@thedwarf.nl" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=2.2.0",
    "pypdfium2>=5.13.0",
]

[project.scripts]
unspeaks = "unspeaks:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
